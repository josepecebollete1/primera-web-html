<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;700&display=swap" rel="stylesheet">

<body>
    <header>
        <a href="https://www.themoviedb.org/?language=ca">
            <img src="https://www.themoviedb.org/assets/v4/logos/v2/blue_short-8e7b30f73a4020692ccca9c88bafe5dcb6f8a62a4c6bc55cd9ba82bb2cd95f6c.svg" alt="Logotip de TMDB" height="25">

        <nav>
            <ul>
                <li><a href="index.html">Buscador</a></li>
                <li><a href="contacte.html">Contacte</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="buscador">
            <h1>Busca una pel·lícula</h1>
            <p>Milions de títols, un sol cercador.</p>
            <form method="get" action="https://www.themoviedb.org/search">
                <label for="cerca">Títol de la pel·lícula</label>
                <input type="search" id="cerca" name="query" placeholder="Cerca una pel·lícula, per exemple «Dune»..." required><button type="submit">Cercar</button>
            </form>
        </section>
        <section class="pelicules">
            <h2>Resultats</h2>
            <div class="resultats">
                <article class="targeta">
                    <img src="img/dune.jpg" alt="Cartell de Dune: Part Two">
                    <h3>Dune: Part Two</h3>
                    <p>2024</p>
                </article>
                <article class="targeta">
                    <img src="img/lotr.jpg" alt="Cartell de The Lord of the Rings: The Two Towers">
                    <h3>The Lord of the Rings: The Two Towers</h3>
                    <p>2002</p>
                </article>
                <article class="targeta">
                    <img src="img/spiderman.jpg" alt="Cartell de Spider-Man: Brand New Day">
                    <h3>Spider-Man: Brand New Day</h3>
                    <p>2026</p>
                </article>
            </div>
        </section>
    </main>
    <footer>
        <p>© 2026 The Movie Database — Maqueta de disseny</p>
    </footer>
</body>
</html>
